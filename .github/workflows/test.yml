name: Tox tests

on: [push, pull_request]

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        include:
          # Django 3.2 + cms 3.9.x — Python 3.9–3.11
          - {python-version: "3.9",  django: 32, cms: 39}
          - {python-version: "3.10", django: 32, cms: 39}
          - {python-version: "3.11", django: 32, cms: 39}
          # Django 4.1 + cms 3.11.x — Python 3.9–3.11
          - {python-version: "3.9",  django: 41, cms: 311}
          - {python-version: "3.10", django: 41, cms: 311}
          - {python-version: "3.11", django: 41, cms: 311}
          # Django 4.2 + cms 3.11.x — Python 3.9–3.12
          - {python-version: "3.9",  django: 42, cms: 311}
          - {python-version: "3.10", django: 42, cms: 311}
          - {python-version: "3.11", django: 42, cms: 311}
          - {python-version: "3.12", django: 42, cms: 311}
          # Django 5.0 + cms 4.x — Python 3.10–3.12
          - {python-version: "3.10", django: 50, cms: 4x}
          - {python-version: "3.11", django: 50, cms: 4x}
          - {python-version: "3.12", django: 50, cms: 4x}
          # Django 5.1 + cms 4.x — Python 3.10–3.13
          - {python-version: "3.10", django: 51, cms: 4x}
          - {python-version: "3.11", django: 51, cms: 4x}
          - {python-version: "3.12", django: 51, cms: 4x}
          - {python-version: "3.13", django: 51, cms: 4x}
          # Django 5.2 + cms 4.x — Python 3.10–3.13
          - {python-version: "3.10", django: 52, cms: 4x}
          - {python-version: "3.11", django: 52, cms: 4x}
          - {python-version: "3.12", django: 52, cms: 4x}
          - {python-version: "3.13", django: 52, cms: 4x}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-django${{ matrix.django }}-cms${{ matrix.cms }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ matrix.python-version }}-django${{ matrix.django }}-cms${{ matrix.cms }}-
    - name: Cache tox
      uses: actions/cache@v4
      with:
        path: .tox
        key: ${{ runner.os }}-tox-py${{ matrix.python-version }}-django${{ matrix.django }}-cms${{ matrix.cms }}-${{ hashFiles('setup.cfg') }}
        restore-keys: |
          ${{ runner.os }}-tox-py${{ matrix.python-version }}-django${{ matrix.django }}-cms${{ matrix.cms }}-
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install gettext libcairo2-dev
        python -m pip install --upgrade pip setuptools tox>4
    - name: Build tox env name
      run: |
        PY=$(echo "${{ matrix.python-version }}" | tr -d '.')
        echo "TOX_ENV=py${PY}-django${{ matrix.django }}-cms${{ matrix.cms }}" >> $GITHUB_ENV
    - name: Test with tox
      env:
        COMMAND: coverage run
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_SERVICE_NAME: github
      run: |
        tox -e$TOX_ENV
        .tox/$TOX_ENV/bin/coverage xml
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel: true
    - uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests
        files: ./coverage.xml
        fail_ci_if_error: false
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
